# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Safrano9999 MCP container image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag; blank uses YYYY.M.D
        required: false
        default: ""
      push_latest:
        description: Also publish latest
        type: boolean
        default: true

concurrency:
  group: safrano9999-mtg-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE_NAME: ghcr.io/safrano9999/safrano9999-mtg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve tag
        id: tags
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          version="${REQUESTED_TAG:-$(date -u +%Y.%-m.%-d)}"
          [[ "$version" =~ ^[A-Za-z0-9_.-]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/scripts/Containerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
            ${{ inputs.push_latest && format('{0}:latest', env.IMAGE_NAME) || '' }}
          labels: io.safrano9999.build.commit=${{ github.sha }}

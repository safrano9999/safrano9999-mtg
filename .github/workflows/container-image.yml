# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Safrano9999 MTG container image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag; blank uses YYYY.M.D
        required: false
        default: ""
      push_latest:
        description: Also publish latest
        type: boolean
        default: true

concurrency:
  group: safrano9999-mtg-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE_NAME: ghcr.io/safrano9999/safrano9999-mtg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify Archidekt runtime patches
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          base_image="$(python3 -c 'import json; print(json.load(open("integrations/archidekt/upstream.json"))["image"])')"
          patch_dir="$RUNNER_TEMP/archidekt-patches"
          docker pull "$base_image"
          python3 integrations/archidekt/prepare.py "$patch_dir" --engine docker
          python3 -c 'import json, pathlib, sys; root=pathlib.Path(sys.argv[1]); print(json.dumps({"source": (root/"public_collection.py").read_text(), "http_base": (root/"http_base.py").read_text()}))' "$patch_dir" \
            | docker run --rm --network=none -i --user 0 \
                -v "$GITHUB_WORKSPACE:/repo:ro" \
                -v "$patch_dir:/verify:ro" \
                --entrypoint python "$base_image" \
                /repo/integrations/archidekt/tests/collection-regression.py
      - name: Resolve tag
        id: tags
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          version="${REQUESTED_TAG:-$(date -u +%Y.%-m.%-d)}"
          [[ "$version" =~ ^[A-Za-z0-9_.-]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/scripts/Containerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
            ${{ inputs.push_latest && format('{0}:latest', env.IMAGE_NAME) || '' }}
          labels: io.safrano9999.build.commit=${{ github.sha }}
